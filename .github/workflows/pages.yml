name: Build and publish proposal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: http6-sdk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-public-boundary.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  sdk-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: PYTHONPATH=packages/python python3 -m unittest discover -s packages/python/tests -p 'test_*.py'
      - run: go test ./...
        working-directory: packages/go
      - run: cargo test --locked
        working-directory: packages/rust
      - run: dotnet build packages/csharp/Http6.ProposedSdk.csproj --nologo
      - run: go test ./cmd/pilot -run '^TestVerifyLedgerRows$'
        working-directory: pilot
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, sdk-checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
